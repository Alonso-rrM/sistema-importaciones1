# Verificación automática en cada subida y en cada pull request.
# Si algo falla aquí, el cambio no debe pasar a main.
name: Verificación

on:
  push:
  pull_request:

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (linter y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base DESECHABLE del propio servidor de verificación (no es una credencial real).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
          pip install -r requirements-dev.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Pruebas (pytest, incluye la batería de seguridad contra PostgreSQL)
        run: pytest

  frontend:
    name: Frontend (linter y compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Linter (ESLint, sin errores y sin advertencias nuevas)
        run: npm run lint:ci
      - name: Compilación
        run: npm run build

  e2e:
    name: Pruebas en navegador (extremo a extremo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base DESECHABLE del propio servidor de verificación (no es una credencial real).
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_e2e_test
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
          pip install -r requirements-dev.txt
      - name: Instalar dependencias del frontend y el navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas en navegador
        working-directory: frontend
        run: npm run e2e
      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: frontend/playwright-report
          retention-days: 7
